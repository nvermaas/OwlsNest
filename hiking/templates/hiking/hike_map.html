<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ hike.name }}</title>

  <!-- Leaflet CSS/JS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet GPX plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

  <!-- Font Awesome Free -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    #map {
      height: 500px;
      width: 100%;
    }

    .fa-marker {
      background: none !important;
      border: none !important;
      width: auto !important;
      height: auto !important;
    }

    .fa-marker i {
      font-size: 24px;
      text-shadow:
        -1px -1px 0 #fff,
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff;
    }
  </style>
</head>

<body>
  <h1>{{ hike.name }}</h1>
  <div id="map"></div>

  {{ points|json_script:"hike-points" }}

  <script>
    // Initialize map
    const map = L.map("map");

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    // Combined bounds for GPX + POIs
    const combinedBounds = L.latLngBounds([]);

    // Font Awesome DivIcon factory
    function faIcon(iconClass, color, size = "24px") {
      return L.divIcon({
        html: `<i class="${iconClass}" style="color:${color};font-size:${size}"></i>`,
        className: "fa-marker",
        iconAnchor: [12, 24],
        popupAnchor: [0, -24],
      });
    }

    // POI icons
    const poiIcons = {
      spring: faIcon("fa-solid fa-droplet", "#0277bd", "14px"),
      camped: faIcon("fa-solid fa-campground", "#2e7d32"),
      campsite: faIcon("fa-solid fa-campground", "#b0aeae", "14px"),
      trailhead: faIcon("fa-solid fa-person-hiking", "#1565c0"),
      crossing: faIcon("fa-solid fa-xmark", "#000000"),
      bridge: faIcon("fa-solid fa-bridge-water", "#0277bd", "14px"),
      car: faIcon("fa-solid fa-car", "#0277bd"),
      residence: faIcon("fa-solid fa-house", "#0277bd"),
      anchor: faIcon("fa-solid fa-anchor", "#0277bd"),
      summit: faIcon("fa-solid fa-mountain", "#0277bd")
    };

    // Layer groups
    const poiLayers = {
      spring: L.layerGroup().addTo(map),
      camped: L.layerGroup().addTo(map),
      campsite: L.layerGroup().addTo(map),
      trailhead: L.layerGroup().addTo(map),
      crossing: L.layerGroup().addTo(map),
      bridge: L.layerGroup().addTo(map),
      car: L.layerGroup().addTo(map),
      residence: L.layerGroup().addTo(map),
      anchor: L.layerGroup().addTo(map),
      summit: L.layerGroup().addTo(map),
    };

    // Load POIs
    const points = JSON.parse(
      document.getElementById("hike-points").textContent
    );

    points.forEach(p => {
      const layer = poiLayers[p.type];
      if (!layer) return;

      const latlng = [p.latitude, p.longitude];

      L.marker(latlng, { icon: poiIcons[p.type] })
        .bindPopup(`<strong>${p.name}</strong><br>${p.description || ""}`)
        .addTo(layer);

      // Extend combined bounds with POI
      combinedBounds.extend(latlng);
    });

    // Add GPX track
    const gpxUrl = "{{ hike.gpx }}";

    new L.GPX(gpxUrl, {
      async: true,
      polyline_options: {
        color: "#e53935",
        weight: 4,
        opacity: 0.85,
      },
      marker_options: {
        startIcon: new L.DivIcon({ html: "" }),
        endIcon: new L.DivIcon({ html: "" }),
        shadowUrl: null,
        wptIconUrls: null
      },
    })
    .on("loaded", e => {
      // Extend bounds with GPX track
      combinedBounds.extend(e.target.getBounds());

      if (combinedBounds.isValid()) {
        map.fitBounds(combinedBounds, { padding: [20, 20] });
      }
    })
    .addTo(map);

    // Layer toggle control
    L.control.layers(null, {
      "Spring": poiLayers.spring,
      "Camped": poiLayers.camped,
      "Campsite": poiLayers.campsite,
      "Waypoint": poiLayers.crossing,
      "Bridge": poiLayers.bridge,
      "Car": poiLayers.car,
      "Hut": poiLayers.residence,
      "Anchor": poiLayers.anchor,
      "Summit": poiLayers.summit
    }).addTo(map);
  </script>
</body>
</html>
